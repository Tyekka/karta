<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта точек — сотрудники и группы</title>
<style>
:root{--fg:#1f2430;--muted:#6b7280;--line:#e3e6ec;--accent:#2563eb;--bg:#fff;--soft:#f4f6fa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--fg)}
#map{position:absolute;inset:0}
#panel{position:absolute;z-index:10;left:10px;top:10px;bottom:64px;width:350px;max-width:calc(100% - 20px);background:var(--bg);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
#panel.collapsed{bottom:auto}
#panel.collapsed #body{display:none}
#head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#head h1{font-size:14px;margin:0;flex:1}
#head button{border:0;background:var(--soft);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
#body{overflow:auto;padding:10px 12px 14px;flex:1}
.sec{margin-bottom:12px}
.sec>h2{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 6px}
.lbl{display:block;font-size:12px;color:var(--muted);margin:6px 0 2px}
input[type=text],select,.ms-b{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;background:#fff;color:var(--fg)}
.ms-b{text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-b.on{border-color:var(--accent);background:#eef3ff;font-weight:600}
.ms{position:relative}
.ms-pop{display:none;position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:3px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px}
.ms.open .ms-pop{display:block}
.ms-list{max-height:220px;overflow:auto;margin:6px 0}
.ms-list label{display:flex;gap:7px;align-items:center;padding:4px 2px;cursor:pointer;color:var(--fg);font-size:13px;margin:0}
.ms-list label span{flex:1}
.ms-list i{font-style:normal;color:var(--muted);font-size:11px}
.ms-act a{color:var(--accent);font-size:12px;cursor:pointer;text-decoration:none}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin-top:6px}
.roles label{display:flex;gap:6px;align-items:center;font-size:12px;cursor:pointer}
.chk{display:flex;gap:7px;align-items:center;margin:5px 0;cursor:pointer}
.stat{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:12px}
.stat b{font-size:15px}
.legend{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
.lg{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:6px;cursor:pointer}
.lg:hover{background:var(--soft)}
.lg s{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg i{font-style:normal;color:var(--muted);font-size:11px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.muted{color:var(--muted);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:var(--accent);width:0}
#ov{position:absolute;inset:0;z-index:30;background:rgba(255,255,255,.96);display:none;align-items:center;justify-content:center;padding:20px}
#ov .card{max-width:440px;width:100%}
#ov h2{margin:0 0 8px;font-size:18px}
.bal a{color:var(--accent);cursor:pointer;text-decoration:none}
.bal table{border-collapse:collapse;margin-top:6px}
.bal td{padding:1px 8px 1px 0;vertical-align:top}
.bal td:first-child{color:#6b7280}
@media (max-width:700px){#panel{right:10px;width:auto;bottom:auto;max-height:calc(100% - 20px)}#panel:not(.collapsed){bottom:64px}}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div id="head"><h1>Карта точек</h1><button id="btnReset" title="Сбросить все фильтры">Сбросить</button><button id="btnCollapse">Свернуть</button></div>
  <div id="body">
    <div class="sec">
      <input type="text" id="q" placeholder="Поиск: адрес, индекс, БГ, сотрудник…">
    </div>

    <div class="sec">
      <h2>Подсветить</h2>
      <div id="ms-d"></div><div id="ms-u"></div><div id="ms-b"></div><div id="ms-r"></div>
      <div id="ms-emp"></div>
      <div class="roles" id="roles"></div>
    </div>

    <div class="sec">
      <h2>Раскрасить по</h2>
      <select id="colorBy"></select>
    </div>

    <div class="sec">
      <h2>Отображение</h2>
      <label class="chk"><input type="checkbox" id="oHide"> Скрыть неподсвеченные точки</label>
      <label class="chk"><input type="checkbox" id="oZones"> Показать зоны подсвеченных точек (по регионам)</label>
      <label class="chk"><input type="checkbox" id="oCluster"> Группировать близкие точки (кластеры)</label>
      <label class="chk"><input type="checkbox" id="oFit" checked> Автомасштаб под выбранное</label>
    </div>

    <div class="sec"><div class="stat" id="stat"></div></div>

    <div class="sec">
      <h2>Легенда <span class="muted" style="text-transform:none;letter-spacing:0">(клик — выбрать)</span></h2>
      <div class="legend" id="legend"></div>
    </div>

    <div class="sec" id="geoBlock">
      <h2>Координаты точек</h2>
      <div class="muted" id="geoStat"></div>
      <div class="bar"><div id="geoBar"></div></div>
      <div class="btns">
        <button class="btn pri" id="btnGeo">Определить координаты</button>
        <button class="btn" id="btnGeoStop" style="display:none">Пауза</button>
        <button class="btn" id="btnExport">Скачать координаты</button>
        <button class="btn" id="btnImport">Загрузить координаты…</button>
        <input type="file" id="fileImport" accept=".json,application/json" style="display:none">
        <button class="btn" id="btnKey">Сменить API-ключ</button>
      </div>
      <div class="muted" id="geoMsg" style="margin-top:6px"></div>
    </div>
  </div>
</div>

<div id="ov"><div class="card">
  <h2 id="ovT">Нужен API-ключ Яндекс Карт</h2>
  <p class="muted" id="ovP">Получить бесплатно: developer.tech.yandex.ru → «Получить ключ» → «JavaScript API и HTTP Геокодер». Ключ сохранится только в этом браузере.</p>
  <input type="text" id="keyIn" placeholder="Вставьте ключ">
  <div class="btns"><button class="btn pri" id="keyOk">Открыть карту</button></div>
</div></div>

let COORDS = Object.assign({}, COORDS0);
try{ Object.assign(COORDS, JSON.parse(lsGet(LS_COORDS)||'{}')); }catch(e){}
function applyCoords(){
  DATA.forEach(p => {
    const c = COORDS[p.i];
    if(c){
      let lat=c[0], lon=c[1];
      if(c[2]==='c'){ // координата только города — слегка разносим точки
        const a=((p.i*9301+49297)%233280)/233280, b=((p.i*7919+12345)%233280)/233280;
        lat += (a-.5)*0.03; lon += (b-.5)*0.05;
      }
      p.ll=[lat,lon]; p.cq=c[2]||'a';
    } else { p.ll=null; p.cq=null; }
  });
}
applyCoords();

/* ===================== СОСТОЯНИЕ ===================== */
const S = {color:'d', f:{d:new Set(),u:new Set(),b:new Set(),r:new Set(),emp:new Set()}, roles:new Set(ROLES),
           hide:false, zones:false, cluster:false, fit:true, search:''};
const isFiltering = () => !!(S.search || S.f.d.size||S.f.u.size||S.f.b.size||S.f.r.size||S.f.emp.size);
function matches(p){
  for(const k of ['d','u','b','r']) if(S.f[k].size && !S.f[k].has(p[k])) return false;
  if(S.f.emp.size){ let ok=false; for(const rl of S.roles){ if(S.f.emp.has(p[rl])){ok=true;break;} } if(!ok) return false; }
  if(S.search && !p._s.includes(S.search)) return false;
  return true;
}

/* ===================== ЦВЕТА ===================== */
const PALETTE=['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc948','#b07aa1','#ff9da7','#9c755f','#6c6f7d','#1f9e89','#c0392b'];
function hsl2hex(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join(''); }
function colorAt(i){ if(i<PALETTE.length) return PALETTE[i]; const j=i-PALETTE.length; return hsl2hex((j*137.508)%360, 62+(j%3)*10, 42+(j%4)*6); }
const DIM_COLORS={};
function dimColors(dim){
  if(DIM_COLORS[dim]) return DIM_COLORS[dim];
  const cnt=new Map(); DATA.forEach(p=>{ if(dim==='emp'){} cnt.set(p[dim],(cnt.get(p[dim])||0)+1); });
  const keys=[...cnt.keys()].sort((a,b)=>cnt.get(b)-cnt.get(a)||String(a).localeCompare(String(b),'ru',{numeric:true}));
  const m=new Map(); keys.forEach((k,i)=>m.set(k,colorAt(i)));
  return DIM_COLORS[dim]=m;
}
const effColor = () => (S.color==='ROLE' && !S.f.emp.size) ? 'd' : S.color;
function catOf(p){
  if(S.color==='ROLE' && S.f.emp.size){
    const r=[...S.roles].filter(x=>S.f.emp.has(p[x])).map(x=>DIMS[x].short);
    return r.length ? r.join(' + ') : '—';
  }
  return p[effColor()];
}
let roleColors=new Map();
function colorOfCat(c){
  if(S.color==='ROLE' && S.f.emp.size) return roleColors.get(c)||'#9aa0ac';
  return dimColors(effColor()).get(c)||'#9aa0ac';
}
function rebuildRoleColors(){
  roleColors=new Map(); const cnt=new Map();
  DATA.forEach(p=>{ if(p.ll && matches(p)){ const c=catOf(p); cnt.set(c,(cnt.get(c)||0)+1); } });
  [...cnt.keys()].sort((a,b)=>cnt.get(b)-cnt.get(a)).forEach((k,i)=>roleColors.set(k,PALETTE[[4,0,1,2,6,3,5,7][i%8]]));
}

/* ===================== ИКОНКИ ===================== */
const iconCache={};
function iconHref(color,size,stroke){
  const key=color+size+stroke; if(iconCache[key]) return iconCache[key];
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+(size/2-1.2)+'" fill="'+color+'" stroke="'+stroke+'" stroke-width="1.4"/></svg>';
  return iconCache[key]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function options(dim){
  const cnt=new Map();
  if(dim==='emp'){
    DATA.forEach(p=>{ new Set(ROLES.map(r=>p[r])).forEach(e=>cnt.set(e,(cnt.get(e)||0)+1)); });
  } else DATA.forEach(p=>cnt.set(p[dim],(cnt.get(p[dim])||0)+1));
  return [...cnt.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'ru',{numeric:true})).map(([v,n])=>({v,n,label:dim==='emp'?v:disp(dim,v)}));
}

    '<div class="ms-pop"><input type="text" placeholder="Поиск…"><div class="ms-list"></div><div class="ms-act"><a>Сбросить выбор</a></div></div></div>';
  const root=host.firstChild, btn=root.querySelector('.ms-b'), list=root.querySelector('.ms-list'), inp=root.querySelector('input');

      cb.onchange=()=>{ cb.checked?set.add(o.v):set.delete(o.v); if(key==='emp'&&set.size&&S.color!=='ROLE'&&!S._userColor){S.color='ROLE';$('#colorBy').value='ROLE';} renderBtn(); refresh(true); };

  root.querySelector('.ms-pop').onclick=e=>e.stopPropagation();

  root.querySelector('.ms-act a').onclick=()=>{ set.clear(); renderBtn(); renderList(); refresh(true); };
  MULTIS[key]={root,renderBtn,renderList};

/* ===================== КАРТА ===================== */
let map, hiColl, dimColl, zoneColl, clusterer;

function balloonHtml(p){
  const row=(k,v,link)=>'<tr><td>'+k+'</td><td>'+link+'</td></tr>';
  const emp=ROLES.map(r=>row(DIMS[r].label,'','<a onclick="return pickEmp(\''+p[r]+'\')">'+esc(p[r])+'</a>')).join('');

    row('Бизнес-группа','','<a onclick="return pickGroup(\'b\',\''+p.b+'\')">'+esc(p.b)+'</a>')+
    emp+'</table>'+(p.cq&&p.cq!=='a'?'<div style="color:#b45309;margin-top:6px;font-size:12px">Координата приблизительная ('+(p.cq==='s'?'до улицы':'до населённого пункта')+')</div>':'')+'</div>';
}
function ensurePm(p){
  if(p._pm) return p._pm;
  p._pm=new ymaps.Placemark(p.ll,{hintContent:esc(p.c+', '+p.s),balloonContent:balloonHtml(p)},
    {iconLayout:'default#image',iconImageHref:iconHref('#888',10,'#fff'),iconImageSize:[10,10],iconImageOffset:[-5,-5],balloonMaxWidth:340,hideIconOnBalloonOpen:false});
  return p._pm;
}
function setIcon(pm,color,size,z){
  pm.options.set({iconImageHref:iconHref(color,size,'#ffffff'),iconImageSize:[size,size],iconImageOffset:[-size/2,-size/2],zIndex:z});
}

function hull(P){
  P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const U=[]; for(const p of P){ const l=U[U.length-1]; if(!l||l[0]!==p[0]||l[1]!==p[1]) U.push(p); }
  P=U; if(P.length<3) return P;
  const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[]; for(const p of P){ while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  const up=[]; for(let i=P.length-1;i>=0;i--){ const p=P[i]; while(up.length>=2&&cross(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  up.pop(); lo.pop(); return lo.concat(up);
}
function drawZones(matched){
  zoneColl.removeAll();
  if(!S.zones||!matched.length) return;
  const byReg=new Map(); matched.forEach(p=>{ if(!byReg.has(p.r)) byReg.set(p.r,[]); byReg.get(p.r).push(p); });
  byReg.forEach((arr,reg)=>{
    const col={}; arr.forEach(p=>{ const c=catOf(p); col[c]=(col[c]||0)+1; });
    const top=Object.keys(col).sort((a,b)=>col[b]-col[a])[0];
    const hex=colorOfCat(top).replace('#','');
    const pts=arr.map(p=>[p.ll[1],p.ll[0]]);
    const h=hull(pts);
    const hint=reg+': '+arr.length+' точ.';
    const cx=pts.reduce((s,p)=>s+p[0],0)/pts.length, cy=pts.reduce((s,p)=>s+p[1],0)/pts.length;
    if(h.length<3){
      let rad=15000; pts.forEach(p=>{ const d=ymaps.coordSystem.geo.getDistance([cy,cx],[p[1],p[0]]); if(d+8000>rad) rad=d+8000; });
      zoneColl.add(new ymaps.Circle([[cy,cx],rad],{hintContent:hint},{fillColor:hex+'33',strokeColor:hex+'cc',strokeWidth:2,interactivityModel:'default#transparent'}));
    } else {
      const ring=h.map(p=>[cy+(p[1]-cy)*1.12, cx+(p[0]-cx)*1.12]);
      zoneColl.add(new ymaps.Polygon([ring],{hintContent:hint},{fillColor:hex+'33',strokeColor:hex+'cc',strokeWidth:2,interactivityModel:'default#transparent'}));
    }
  });
}

function updateMap(fit){
  const filtering=isFiltering();
  if(S.color==='ROLE'&&S.f.emp.size) rebuildRoleColors();
  hiColl.removeAll(); dimColl.removeAll(); clusterer.removeAll();
  map.geoObjects.remove(clusterer); map.geoObjects.remove(hiColl);
  const hi=[], dim=[], matched=[];
  DATA.forEach(p=>{
    if(!p.ll) return;
    const m=matches(p);
    if(!filtering||m){
      const pm=ensurePm(p); setIcon(pm,colorOfCat(catOf(p)),filtering?15:11,500); hi.push(pm); if(m) matched.push(p);
    } else if(!S.hide){
      const pm=ensurePm(p); setIcon(pm,'#c3c8d2',7,100); dim.push(pm);
    }
  });
  dimColl.add(dim);
  if(S.cluster){ clusterer.add(hi); map.geoObjects.add(clusterer); } else { hiColl.add(hi); map.geoObjects.add(hiColl); }
  drawZones(filtering?matched:[]);
  if(fit&&S.fit&&filtering&&matched.length){
    if(matched.length===1) map.setCenter(matched[0].ll,13);
    else { const b=ymaps.util.bounds.fromPoints(matched.map(p=>p.ll)); const wide=window.innerWidth>700;
      map.setBounds(b,{checkZoomRange:true,zoomMargin:wide?[40,40,40,380]:[40,40,40,40]}); }
  }
  S._matched=matched.length;
}

function updateStat(){
  const total=DATA.length, withLL=DATA.filter(p=>p.ll).length;
  const filtering=isFiltering(); const ms=DATA.filter(matches);
  let h='<div>'+(filtering?'Подсвечено: <b>'+ms.length+'</b> из '+total+' точек':'Всего точек: <b>'+total+'</b>')+'</div>';
  if(filtering){
    h+='<div class="muted">Регионов: '+new Set(ms.map(p=>p.r)).size+' · Дирекций: '+new Set(ms.map(p=>p.d)).size+' · БГ: '+new Set(ms.map(p=>p.b)).size+'</div>';
    if(S.f.emp.size){
      h+='<div style="margin-top:4px">'+ROLES.map(r=>DIMS[r].short+': <b>'+ms.filter(p=>S.f.emp.has(p[r])).length+'</b>').join(' · ')+'</div>';
    }
    if(withLL<total) h+='<div class="muted">На карте: '+ms.filter(p=>p.ll).length+' (у остальных нет координат)</div>';
  }
  $('#stat').innerHTML=h;
}

function updateLegend(){
  const filtering=isFiltering(); const cnt=new Map();
  DATA.forEach(p=>{ if(filtering&&!matches(p)) return; const c=catOf(p); cnt.set(c,(cnt.get(c)||0)+1); });
  const dim=effColor();
  const keys=[...cnt.keys()].sort((a,b)=>cnt.get(b)-cnt.get(a)||String(a).localeCompare(String(b),'ru',{numeric:true}));
  const box=$('#legend'); box.innerHTML='';
  keys.forEach(k=>{
    const d=document.createElement('div'); d.className='lg';
    const label=(S.color==='ROLE'&&S.f.emp.size)?k:disp(dim,k);
    d.innerHTML='<s style="background:'+colorOfCat(k)+'"></s><span title="'+esc(label)+'">'+esc(label)+'</span><i>'+cnt.get(k)+'</i>';
    d.onclick=()=>legendPick(k,dim);
    box.appendChild(d);

}
function legendPick(k,dim){
  if(S.color==='ROLE'&&S.f.emp.size) return;
  if(ROLES.includes(dim)){ S.f.emp.clear(); S.f.emp.add(k); S.roles.clear(); S.roles.add(dim); S.color='ROLE'; }
  else { S.f[dim].has(k)?S.f[dim].delete(k):S.f[dim].add(k); }
  syncControls(); refresh(true);
}

function updateGeoStat(){
  const total=DATA.length, n=DATA.filter(p=>p.ll).length, approx=DATA.filter(p=>p.ll&&p.cq==='c').length;
  $('#geoStat').textContent='Определено: '+n+' из '+total+(approx?' (из них только до города: '+approx+')':'');
  $('#geoBar').style.width=(100*n/total)+'%';
  $('#btnGeo').style.display=(n<total)?'':'none';

function refresh(fit){ if(!map) return; updateMap(fit); updateStat(); updateLegend(); updateGeoStat(); }

/* ===================== ГЕОКОДИРОВАНИЕ В БРАУЗЕРЕ ===================== */
let geoRun=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function saveCoords(){ lsSet(LS_COORDS,JSON.stringify(COORDS)); }
async function geocodeOne(query){
  const res=await ymaps.geocode(query,{results:1});
  const g=res.geoObjects.get(0); if(!g) return null;
  const prec=g.properties.get('metaDataProperty.GeocoderMetaData.precision');
  const c=g.geometry.getCoordinates();
  return [c[0],c[1],(prec==='exact'||prec==='number'||prec==='near')?'a':(prec==='street'?'s':'c')];
}
async function geocodeAll(){
  if(geoRun) return; geoRun=true;
  $('#btnGeo').style.display='none'; $('#btnGeoStop').style.display='';
  $('#geoMsg').textContent='';
  const todo=DATA.filter(p=>!p.ll); const memo=new Map(); let done=0, fail=0;
  try{
    for(const p of todo){
      if(!geoRun) break;
      const full=[p.r,p.c,p.q].filter(Boolean).join(', ');
      let r;
      if(memo.has(full)) r=memo.get(full);
      else {
        r=await geocodeOne(full);
        if(!r||r[2]==='c'){ const city=await geocodeOne([p.r,p.c].join(', ')); if(city) r=[city[0],city[1],'c']; }
        memo.set(full,r); await sleep(120);
      }
      if(r) COORDS[p.i]=r; else fail++;
      done++;
      if(done%10===0){ saveCoords(); applyCoords(); refresh(false); $('#geoMsg').textContent='Обработано '+done+' из '+todo.length+'…'; }
    }
    $('#geoMsg').textContent=geoRun?('Готово. Не найдено адресов: '+fail+'.'):'Пауза. Прогресс сохранён в браузере.';
  }catch(e){
    $('#geoMsg').textContent='Остановлено: '+(e&&e.message?e.message:e)+'. Прогресс сохранён — можно продолжить позже (дневной лимит бесплатного ключа ограничен).';
  }
  geoRun=false; saveCoords(); applyCoords(); refresh(true);
  $('#btnGeoStop').style.display='none'; updateGeoStat();
}
$('#btnGeo').onclick=geocodeAll;
$('#btnGeoStop').onclick=()=>{ geoRun=false; };
$('#btnExport').onclick=()=>{
  const out={}; DATA.forEach(p=>{ if(COORDS[p.i]) out[p.i]=COORDS[p.i]; });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
  a.download='coords.json'; document.body.appendChild(a); a.click(); a.remove();
};
$('#btnImport').onclick=()=>$('#fileImport').click();
$('#fileImport').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{
    try{ const j=JSON.parse(rd.result); let n=0; Object.keys(j).forEach(k=>{ if(Array.isArray(j[k])&&j[k].length>=2){ COORDS[k]=j[k]; n++; } });
      saveCoords(); applyCoords(); refresh(true); $('#geoMsg').textContent='Загружено координат: '+n; }
    catch(err){ $('#geoMsg').textContent='Не удалось прочитать файл: '+err.message; }
  }; rd.readAsText(f); e.target.value='';
};

function initMap(){
  map=new ymaps.Map('map',{center:[57,70],zoom:3,controls:[]});
  map.controls.add('typeSelector',{float:'none',position:{top:10,right:10}});
  map.controls.add('zoomControl',{float:'none',position:{top:56,right:10}});
  zoneColl=new ymaps.GeoObjectCollection(); dimColl=new ymaps.GeoObjectCollection(); hiColl=new ymaps.GeoObjectCollection();
  clusterer=new ymaps.Clusterer({preset:'islands#invertedDarkBlueClusterIcons',groupByCoordinates:false,gridSize:72,clusterOpenBalloonOnClick:false,clusterDisableClickZoom:false});
  map.geoObjects.add(zoneColl); map.geoObjects.add(dimColl); map.geoObjects.add(hiColl);
  window.__map=map;
  refresh(false);
  const pts=DATA.filter(p=>p.ll).map(p=>p.ll);
  if(pts.length>1) map.setBounds(ymaps.util.bounds.fromPoints(pts),{checkZoomRange:true,zoomMargin:window.innerWidth>700?[30,30,30,380]:[30,30,30,30]});
  if(!PUBLIC && pts.length<DATA.length) $('#geoMsg').textContent='Для части точек ещё нет координат — нажмите «Определить координаты».';
}
function loadYmaps(){
  const stored=lsGet(LS_KEY); if(stored) API_KEY=stored;
  if(!API_KEY){ showOverlay('Нужен API-ключ Яндекс Карт','Получить бесплатно: developer.tech.yandex.ru → «Получить ключ» → «JavaScript API и HTTP Геокодер». Ключ сохранится только в этом браузере.',true); return; }
  const s=document.createElement('script');
  s.src='https://api-maps.yandex.ru/2.1/?apikey='+encodeURIComponent(API_KEY)+'&lang=ru_RU';
  s.onload=()=>ymaps.ready(initMap);
  s.onerror=()=>showOverlay('Карта не загрузилась','Проверьте интернет и API-ключ.',true);
  document.head.appendChild(s);
  setTimeout(()=>{ if(!map && !window.ymaps) showOverlay('Карта не загрузилась','Проверьте интернет и API-ключ.',true); },15000);
}
window.__S=S; window.__DATA=DATA;
loadYmaps();
</script>
